<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>MailCraft Editor — vanilla JS example</title>
<style>
  html, body { margin: 0; height: 100%; font-family: sans-serif; }
  /* The bar below stands in for the host application's own chrome: theme and
     language are host decisions, pushed into the editor as attributes. */
  #host-bar { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; box-sizing: border-box; background: #111827; color: #f9fafb; font-size: 13px; }
  #host-bar strong { font-weight: 600; letter-spacing: 0.02em; margin-right: auto; }
  #host-bar button, #host-bar select { font: inherit; font-size: 12.5px; padding: 5px 12px; border-radius: 6px; border: 1px solid #4b5563; background: #1f2937; color: #f9fafb; cursor: pointer; }
  #host-bar button:hover, #host-bar select:hover { border-color: #9ca3af; }
  mailcraft-editor { display: block; height: calc(100vh - 46px); }
</style>
</head>
<body>
<div id="host-bar">
  <strong>Host app</strong>
  <!-- The template gallery is host UI: the editor has no Templates tab. This
       picker just sends email HTML to editor.loadTemplate() -- that's the
       whole integration. -->
  <label for="template-select">Template</label>
  <select id="template-select"></select>
  <button id="template-btn" type="button">Load</button>
  <label for="lang-select">Language</label>
  <select id="lang-select"></select>
  <button id="theme-btn" type="button">Switch to dark</button>
</div>

<!-- `theme` and `locale` are host-owned: while the `theme` attribute is
     present the editor hides its built-in light/dark toggle, and `locale`
     selects a shipped UI translation (plus RTL for e.g. locale="ar"). -->
<mailcraft-editor
  id="editor"
  variables="first_name,last_name,email,company,unsubscribe_url"
  campaign="Welcome email"
  theme="light"
  locale="en"
></mailcraft-editor>

<!-- Plain script (not type="module") so this file also works when opened
     directly by double-clicking it -- browsers block ES module imports from
     file:// pages. Regenerate after touching src/ with `npm run build`. -->
<script src="../dist/mailcraft-editor.bundle.js"></script>

<!-- ---- template gallery (host content) -------------------------------------
     Each block below is a complete email as plain HTML, inlined so this demo
     works when double-clicked (fetch() is blocked on file:// pages). The same
     emails live as standalone files in templates/ to copy into your own app;
     a real host would pull the HTML from wherever it stores templates. -->
