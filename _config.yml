# GitHub Pages site config.
# Source: branch `main`, folder `/ (root)` — see Settings -> Pages.
#
# GitHub Pages enables these plugins by default, and this site relies on them:
#   jekyll-readme-index         (inert here: it only promotes README.md when
#                               the site has no index file, and index.html is
#                               the homepage -- so it claims nothing)
#   jekyll-optional-front-matter  .md files render without needing front matter
#                               (see optional_front_matter below: README.md
#                               is on its default skip list, and with
#                               readme-index inert nothing else would render it)
#   jekyll-relative-links       [DOCS.md](DOCS.md) rewrites to DOCS.html
#   jekyll-titles-from-headings page titles come from the first H1
#
# The look comes from `_layouts/default.html` + `assets/css/site.css`, not from
# the theme below — it stays declared only as a fallback if the layout is ever
# removed. Every layout link is a plain relative path, so no `baseurl` is
# needed here: the site works the same at /blocks-mailcraft/, at a custom
# domain, and under a local `jekyll serve`.

title: Blocks MailCraft
description: A drag-and-drop HTML email editor, packaged as a single Web Component.
# The custom domain. `CNAME` at the repo root is what GitHub Pages actually
# serves from; this one is for the absolute URLs in page metadata. A custom
# domain is served from the host root, so there is no baseurl either way.
url: https://mailcraft.seliseblocks.com
theme: jekyll-theme-primer

# Markdown files render through the site layout; `examples/vanilla.html` has no
# front matter, so Jekyll copies it verbatim — it carries its own chrome.
defaults:
  - scope:
      path: ""
    values:
      layout: default

# jekyll-optional-front-matter skips README.md by default, leaving it for
# jekyll-readme-index -- which only claims a README on a site that has no
# index page. This site has index.html, so the two plugins handed README.md
# to each other and neither rendered it: /README.html was a 404 while every
# other .md on the site (DOCS, CONTRIBUTING, SECURITY) converted normally,
# and the file shipped as raw markdown at /README.md instead. An empty
# exclude list hands it back to the converter. Front matter in README.md
# would fix it too, but that file is also the npm and GitHub landing page,
# where a stray `---` block is visible clutter.
optional_front_matter:
  exclude: []

exclude:
  - node_modules/
  - test/
  - coverage/
  - .cov/
  - build.js
  - tools/
  - package.json
  - package-lock.json
  - AGENTS.md
  - "*.log"
